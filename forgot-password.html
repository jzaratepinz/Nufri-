<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172c46">
  <link rel="icon" type="image/svg+xml" href="./nufri-icon.svg">
  <title>Recuperar acceso · Temporeros Nufri</title>
  <style>
    :root{color-scheme:light;--ink:#172c46;--muted:#617086;--line:#d8e0e9;--paper:#f3f6fa;--white:#fff;--accent:#1d5d91}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:18px}
    main{width:min(100%,440px);padding:26px;background:var(--white);border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 42px #172c4617}
    .brand{margin:0 0 8px;color:var(--accent);font-size:13px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
    h1{margin:0 0 8px;font-size:24px;line-height:1.2}p{margin:0 0 18px;color:var(--muted)}
    label{display:grid;gap:7px;margin:18px 0 12px;color:var(--muted);font-size:14px;font-weight:650}
    input{width:100%;min-height:48px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--white);color:var(--ink);font:inherit}
    input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #70a9d7;outline-offset:2px}
    button,a{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;margin-top:10px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;font-weight:700;text-decoration:none}
    button{background:var(--accent);border-color:var(--accent);color:#fff;cursor:pointer}button:disabled{opacity:.65;cursor:wait}a{color:var(--accent)}
    .message{min-height:22px;margin:14px 0 0;font-size:14px;color:var(--muted)}.message.error{color:#a12626}.message.ok{color:#25623b}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--ink:#e6edf6;--muted:#aab9c8;--line:#33465a;--paper:#101923;--white:#172330;--accent:#397cab}body{background:var(--paper);color:var(--ink)}input{background:#192734;color:var(--ink)}main{box-shadow:0 16px 42px #0005}button{color:#fff}a{background:#203040}}
  </style>
</head>
<body>
  <main>
    <div class="brand">Temporeros Nufri</div>
    <h1>Recuperar contraseña</h1>
    <p>Escribe el correo asociado a tu cuenta. Si está registrado, te enviaremos un enlace para crear una contraseña nueva.</p>
    <form id="recoveryForm">
      <label for="email">Correo electrónico
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="tucorreo@ejemplo.com" required>
      </label>
      <button id="sendButton" type="submit">Enviar enlace de recuperación</button>
    </form>
    <p id="message" class="message" role="status" aria-live="polite"></p>
    <a href="./">Volver a iniciar sesión</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (() => {
      const db = window.supabase.createClient('https://loiyohgcgcgdjrkrbpgm.supabase.co','sb_publishable_MjcIx-_pVKosFuNzni810Q_0QaMUAUi');
      const form = document.getElementById('recoveryForm');
      const emailField = document.getElementById('email');
      const button = document.getElementById('sendButton');
      const message = document.getElementById('message');
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const email = emailField.value.trim();
        if (!email) { emailField.focus(); return; }
        button.disabled = true;
        button.textContent = 'Enviando solicitud…';
        message.textContent = 'Conectando con el servicio de correo…';
        message.className = 'message';
        const redirectTo = new URL('reset-password.html', window.location.href).toString();
        try {
          const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo });
          if (error) throw error;
          message.textContent = 'Solicitud enviada. Si existe una cuenta con ese correo, recibirás un enlace. Revisa también spam y promociones.';
          message.className = 'message ok';
          form.hidden = true;
        } catch (error) {
          message.textContent = error.message || 'No se pudo enviar la solicitud. Espera un momento e inténtalo de nuevo.';
          message.className = 'message error';
          button.disabled = false;
          button.textContent = 'Enviar enlace de recuperación';
        }
      });
    })();
  </script>
</body>
</html>
